<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Score Keeper</title>
  <link rel="stylesheet" href="tokens.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main>
    <header class="app-header">
      <h1 data-string="appTitle">Score Keeper</h1>
    </header>

    <section class="team" aria-labelledby="team-awesome-heading">
      <h2 id="team-awesome-heading" data-string="teams.awesome">Team Awesome</h2>
      <span class="score" aria-live="polite">0</span>
      <div class="team-controls">
        <button type="button" data-action="decrease" data-string="controls.decrease">Decrease</button>
        <button type="button" data-action="increase" data-string="controls.increase">Increase</button>
      </div>
    </section>

    <section class="team" aria-labelledby="team-boring-heading">
      <h2 id="team-boring-heading" data-string="teams.boring">Team Boring</h2>
      <span class="score" aria-live="polite">0</span>
      <div class="team-controls">
        <button type="button" data-action="decrease" data-string="controls.decrease">Decrease</button>
        <button type="button" data-action="increase" data-string="controls.increase">Increase</button>
      </div>
    </section>

    <footer class="app-footer">
      <button type="button" class="language-switch" data-action="cycle-locale" data-string="languageSwitch">Language</button>
      <button type="button" data-action="reset-scores" data-string="controls.reset">Reset</button>
    </footer>
  </main>
  <script src="strings.js"></script>
  <script src="script.js"></script>
</body>
</html>
